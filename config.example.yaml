# aqla runs beside a separate Hermes installation on your VPS.
network: testnet
account: "0x0000000000000000000000000000000000000000"
signer_role: api_wallet
state_path: data/state.sqlite3
private_key_file: secrets/hyperliquid.secret
integration_key_file: secrets/integration.secret
setup_password_hash_file: secrets/setup-password.hash.json
sources: []
# Rules are set by you through Hermes; none are silently selected for you.
policy: null
ranking_enabled: true
express:
  mode: "off"
  master_path: hermes-home/skills/aqla-master/SKILL.md
# Each additional exchange/network has its own protected credentials and approval.
# Account limits and activation are set explicitly through authenticated control.
execution_accounts:
  hyperliquid:mainnet:
    exchange: hyperliquid
    network: mainnet
    account: null
    private_key_file: secrets/hyperliquid-mainnet.secret
  aster:testnet:
    exchange: aster
    network: testnet
    account: null
    signer: null
    private_key_file: secrets/aster-testnet.secret
  lighter:testnet:
    exchange: lighter
    network: testnet
    account_index: null
    api_key_index: null
    private_key_file: secrets/lighter-testnet.secret
venues:
  aster:
    network: mainnet
    account: null
    signer: null
    private_key_file: secrets/aster.secret
  lighter:
    network: mainnet
    account_index: null
    api_key_index: null
    private_key_file: secrets/lighter.secret
telegram_session_file: secrets/telegram-session.secret
telegram_api_id: null
telegram_api_hash_file: secrets/telegram-api-hash.secret
google_sheets:
  enabled: false
  spreadsheet_id: null
  credentials_file: secrets/google-service-account.secret
  sync_interval_seconds: 30
  batch_size: 100
